<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Feature flag changes correlated with observability signals</title>
  <desc id="desc">An observability dashboard timeline showing a feature flag rollout change before a bug, with logs, metrics, traces, alerts, and rollback action connected.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#18a058"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12345a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f5f8fc"/>
  <rect x="44" y="42" width="1112" height="596" rx="24" fill="white" filter="url(#shadow)"/>
  <rect x="44" y="42" width="1112" height="70" rx="24" fill="#10233f"/>
  <text x="78" y="86" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Observability timeline: flag change before the bug</text>
  <text x="898" y="86" fill="#b8d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Release health dashboard</text>

  <g transform="translate(78 142)">
    <rect width="286" height="410" rx="18" fill="url(#panel)" stroke="#d7e4f5"/>
    <text x="24" y="42" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Flag activity</text>
    <g transform="translate(24 70)">
      <circle cx="10" cy="14" r="7" fill="#18a058"/>
      <text x="30" y="19" fill="#22324a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">09:12 checkout-redesign</text>
      <text x="30" y="43" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Variation changed: control -> new-ui</text>
      <text x="30" y="65" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Targeting: beta users, 5%</text>
    </g>
    <g transform="translate(24 162)">
      <circle cx="10" cy="14" r="7" fill="#2f80ed"/>
      <text x="30" y="19" fill="#22324a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">09:27 payment-flow-v2</text>
      <text x="30" y="43" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Rollout increased: 5% -> 15%</text>
      <text x="30" y="65" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Owner: release captain</text>
    </g>
    <g transform="translate(24 254)">
      <circle cx="10" cy="14" r="7" fill="#f59e0b"/>
      <text x="30" y="19" fill="#22324a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">09:43 search-ranking-ai</text>
      <text x="30" y="43" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Rule added: enterprise segment</text>
      <text x="30" y="65" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Audit event from FeatBit webhook</text>
    </g>
  </g>

  <g transform="translate(398 142)">
    <rect width="704" height="410" rx="18" fill="white" stroke="#d7e4f5"/>
    <text x="24" y="42" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Health signals after exposure</text>
    <text x="540" y="42" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">09:00 - 10:00</text>

    <line x1="58" y1="322" x2="660" y2="322" stroke="#d9e4f2" stroke-width="2"/>
    <line x1="58" y1="248" x2="660" y2="248" stroke="#edf2f8" stroke-width="2"/>
    <line x1="58" y1="174" x2="660" y2="174" stroke="#edf2f8" stroke-width="2"/>
    <line x1="58" y1="100" x2="660" y2="100" stroke="#edf2f8" stroke-width="2"/>

    <path d="M58 286 C128 280 168 282 222 275 C272 270 302 262 330 246 C370 222 394 180 425 142 C456 104 498 94 540 132 C584 172 608 226 660 252" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 304 C142 303 206 302 270 301 C342 298 394 291 444 272 C502 250 558 246 660 252" fill="none" stroke="#2f80ed" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 295 C150 296 230 294 312 292 C390 290 468 288 660 286" fill="none" stroke="#18a058" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(58 344)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7890">
      <text x="0" y="0">09:00</text><text x="147" y="0">09:15</text><text x="294" y="0">09:30</text><text x="441" y="0">09:45</text><text x="588" y="0">10:00</text>
    </g>

    <line x1="330" y1="86" x2="330" y2="326" stroke="#18a058" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="212" y="66" width="236" height="58" rx="12" fill="#e9f8ef" stroke="#98dab2"/>
    <text x="230" y="90" fill="#0f7a3c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Flag rollout change</text>
    <text x="230" y="111" fill="#35664a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">payment-flow-v2: 5% -> 15%</text>

    <line x1="494" y1="86" x2="494" y2="326" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="452" y="66" width="184" height="58" rx="12" fill="#fff1f2" stroke="#f6a5ad"/>
    <text x="470" y="90" fill="#b4232f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Bug detected</text>
    <text x="470" y="111" fill="#7f3840" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">error rate + latency spike</text>

    <g transform="translate(82 380)">
      <circle cx="0" cy="0" r="6" fill="#f97316"/><text x="14" y="5" fill="#516177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Error rate</text>
      <circle cx="132" cy="0" r="6" fill="#2f80ed"/><text x="146" y="5" fill="#516177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">p95 latency</text>
      <circle cx="268" cy="0" r="6" fill="#18a058"/><text x="282" y="5" fill="#516177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Traffic</text>
    </g>
  </g>

  <g transform="translate(128 580)">
    <rect width="944" height="40" rx="20" fill="#eef6ff" stroke="#cfe3ff"/>
    <text x="28" y="26" fill="#24476f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Webhook event -> dashboard annotation -> alert -> Slack/incident channel -> FeatBit trigger or REST API rollback</text>
    <path d="M835 20 h46" stroke="#2f80ed" stroke-width="3" stroke-linecap="round"/>
    <path d="M876 12 l11 8 -11 8" fill="none" stroke="#2f80ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

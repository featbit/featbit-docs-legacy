<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Feature flag evaluation inside a request flame graph</title>
  <desc id="desc">A trace flame graph showing a request entering an API endpoint, evaluating a feature flag, selecting a code path, and recording span attributes for debugging.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12345a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f5f8fc"/>
  <rect x="44" y="42" width="1112" height="596" rx="24" fill="white" filter="url(#shadow)"/>
  <rect x="44" y="42" width="1112" height="70" rx="24" fill="#10233f"/>
  <text x="78" y="86" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Trace flame graph: flag decision to code path</text>
  <text x="852" y="86" fill="#b8d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">APM / distributed tracing</text>

  <g transform="translate(78 142)">
    <rect width="760" height="416" rx="18" fill="#fbfdff" stroke="#d7e4f5"/>
    <text x="24" y="42" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">request trace</text>
    <text x="610" y="42" fill="#5b6b82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">GET /checkout</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
      <rect x="34" y="76" width="692" height="46" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="52" y="105" fill="#174a8b">api.checkout.handleRequest</text>
      <text x="654" y="105" fill="#174a8b">420ms</text>

      <rect x="64" y="136" width="246" height="42" rx="8" fill="#e9f8ef" stroke="#9bd9b3"/>
      <text x="80" y="163" fill="#0f7a3c">loadUserAndCart</text>

      <rect x="318" y="136" width="278" height="42" rx="8" fill="#fff7ed" stroke="#fdba74"/>
      <text x="334" y="163" fill="#9a4b05">evaluateFlag(payment-flow-v2)</text>

      <rect x="604" y="136" width="122" height="42" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="620" y="163" fill="#5b21b6">render</text>

      <rect x="334" y="194" width="158" height="42" rx="8" fill="#fef3c7" stroke="#facc15"/>
      <text x="350" y="221" fill="#854d0e">FeatBit SDK</text>

      <rect x="500" y="194" width="196" height="42" rx="8" fill="#ffe4e6" stroke="#fda4af"/>
      <text x="516" y="221" fill="#9f1239">newPaymentFlow()</text>

      <rect x="516" y="252" width="92" height="42" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="532" y="279" fill="#991b1b">validate</text>

      <rect x="612" y="252" width="84" height="42" rx="8" fill="#fecaca" stroke="#f87171"/>
      <text x="628" y="279" fill="#991b1b">charge</text>

      <rect x="224" y="310" width="214" height="42" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="240" y="337" fill="#075985">legacyPaymentFlow()</text>
      <rect x="452" y="310" width="244" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="468" y="337" fill="#334155">span attributes recorded</text>
    </g>

    <path d="M457 178 V194" stroke="#9a4b05" stroke-width="2"/>
    <path d="M492 215 H500" stroke="#9a4b05" stroke-width="2"/>
    <path d="M598 236 V252" stroke="#9f1239" stroke-width="2"/>
    <path d="M598 236 H654 V252" fill="none" stroke="#9f1239" stroke-width="2"/>
    <path d="M413 236 V292 H331 V310" fill="none" stroke="#2f80ed" stroke-width="2" stroke-dasharray="6 6"/>

    <g transform="translate(42 374)">
      <rect width="676" height="26" rx="13" fill="#f8fafc" stroke="#d7e4f5"/>
      <text x="20" y="18" fill="#516177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Span tags: feature_flag.key=payment-flow-v2   variation=new-flow   reason=targeting-match   user.segment=beta</text>
    </g>
  </g>

  <g transform="translate(870 142)">
    <rect width="252" height="416" rx="18" fill="#fbfdff" stroke="#d7e4f5"/>
    <text x="22" y="42" fill="#10233f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Debug view</text>

    <rect x="22" y="70" width="208" height="82" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="40" y="96" fill="#9a4b05" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Flag decision</text>
    <text x="40" y="120" fill="#5b4325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">payment-flow-v2</text>
    <text x="40" y="140" fill="#5b4325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">variation: new-flow</text>

    <rect x="22" y="174" width="208" height="82" rx="14" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="40" y="200" fill="#9f1239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Selected code path</text>
    <text x="40" y="224" fill="#6e2432" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">newPaymentFlow()</text>
    <text x="40" y="244" fill="#6e2432" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">charge() latency spike</text>

    <rect x="22" y="278" width="208" height="82" rx="14" fill="#e9f8ef" stroke="#9bd9b3"/>
    <text x="40" y="304" fill="#0f7a3c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Action</text>
    <text x="40" y="328" fill="#315f45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">pause rollout or rollback</text>
    <text x="40" y="348" fill="#315f45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">through FeatBit trigger</text>
  </g>

  <path d="M566 362 C700 410 768 412 870 216" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8"/>
  <path d="M858 214 l13 1 -6 12" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(128 586)">
    <rect width="944" height="34" rx="17" fill="#eef6ff" stroke="#cfe3ff"/>
    <text x="28" y="23" fill="#24476f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Instrumentation point: add feature flag key, variation, and evaluation result to the active span before branching into code.</text>
  </g>
</svg>
